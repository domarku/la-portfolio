<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Garden walk</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0d0a;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color: #cdd6c4;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      /* The renderer canvas is upscaled with hard pixels — no smoothing. */
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
